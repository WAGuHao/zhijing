.badge.multiple{background:#f5f3ff;color:#6d28d9}
.question-text{font-size:17px;white-space:pre-wrap;word-break:break-word;margin:8px 0 16px}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font-size:15px;transition:.15s}
.option:hover{border-color:#bfdbfe;background:#f8fbff}
.option .key{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
.option.selected{border-color:var(--brand);background:var(--brand-weak)}
.option.correct{border-color:var(--ok);background:var(--ok-weak)}
.option.wrong{border-color:var(--bad);background:var(--bad-weak)}
.reveal{margin-top:16px;padding:14px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);font-size:14px;white-space:pre-wrap;word-break:break-word}
.reveal .ans{font-weight:800;color:var(--brand)}
.reveal.correct{background:var(--ok-weak);border-color:#bbf7d0}
.reveal.wrong{background:var(--bad-weak);border-color:#fecaca}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.actions .spacer{flex:1}
.wrong-list{display:flex;flex-direction:column;gap:14px}
.wrong-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.wrong-item .meta{margin-bottom:8px}
.wrong-count{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--bad-weak);color:var(--bad)}
.wrong-explanation{margin-top:8px;padding-top:8px;border-top:1px dashed #e2e8f0;color:var(--muted);font-size:14px}
.wrong-explanation .expl-label{display:inline-block;margin-right:6px;padding:2px 7px;border-radius:6px;background:var(--brand-weak);color:var(--brand);font-size:12px;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:9px 14px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow)}
.hidden{display:none !important}
/* 模考报告 */
.report-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.report-sub{color:var(--muted);font-size:13px;margin-top:2px}
.report-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:16px}
.report-stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center}
.report-stat .num{font-size:24px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.report-stat .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.report-stat .num.ok{color:var(--ok)}
.report-stat .num.bad{color:var(--bad)}
.report-tabs{display:flex;gap:8px;margin:0 0 16px}
.report-tabs .btn.active{background:var(--brand);border-color:var(--brand);color:#fff}
.report-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.report-item .q-text{font-size:15px;white-space:pre-wrap;word-break:break-word;margin:8px 0 10px}
.report-options{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.report-opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;text-align:left}
.report-opt .key{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-size:12px}
.report-opt.is-answer{border-color:var(--ok);background:var(--ok-weak)}
.report-opt.chosen-wrong{border-color:var(--bad);background:var(--bad-weak)}
.report-opt .tag{margin-left:auto;font-size:11px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.tag-ok{color:var(--ok)}
.tag-bad{color:var(--bad)}
.report-answer-line{margin-top:8px;font-size:14px;color:var(--muted)}
.report-answer-line b{color:var(--text)}
.report-answer-line .yours-bad{color:var(--bad);font-weight:700}
.report-answer-line .yours-ok{color:var(--ok);font-weight:700}
.report-expl{margin-top:10px;padding:10px;border-radius:10px;background:#f8fafc;border:1px dashed #cbd5e1;font-size:13px;white-space:pre-wrap;word-break:break-word;color:var(--muted)}
.report-expl .expl-label{display:inline-block;margin-right:6px;padding:2px 7px;border-radius:6px;background:var(--brand-weak);color:var(--brand);font-size:12px;font-weight:800}
.report-empty{padding:40px 20px;text-align:center;color:var(--muted)}
/* 答题卡总览 */
.answer-card-fab{position:fixed;left:16px;bottom:16px;z-index:50;display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;background:#0f172a;color:#fff;font-size:14px;font-weight:700;box-shadow:0 8px 24px rgba(15,23,42,.25);border:none;cursor:pointer}
.answer-card-fab:hover{background:#1e293b}
.answer-card-panel{position:fixed;left:16px;bottom:76px;z-index:50;width:340px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 48px rgba(15,23,42,.18);padding:14px;display:none;flex-direction:column}
.answer-card-panel.show{display:flex}
.answer-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.answer-card-head b{font-size:14px;white-space:nowrap}
.answer-card-legend{display:flex;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap}
.answer-card-legend .dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:3px;vertical-align:-1px}
.answer-card-legend .dot.ok{background:var(--ok-weak);border:1px solid var(--ok)}
.answer-card-legend .dot.bad{background:var(--bad-weak);border:1px solid var(--bad)}
.answer-card-legend .dot.na{background:#fff;border:1px solid var(--line)}
.answer-card-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-height:calc(60vh - 90px);overflow-y:auto;padding-right:2px}
.ac-cell{display:flex;align-items:center;justify-content:center;height:28px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);transition:transform .12s,box-shadow .12s;font-variant-numeric:tabular-nums}
.ac-cell.ok{background:var(--ok-weak);border-color:var(--ok);color:#15803d}
.ac-cell.bad{background:var(--bad-weak);border-color:var(--bad);color:#b91c1c}
.ac-cell:hover{transform:scale(1.12);box-shadow:0 2px 6px rgba(15,23,42,.15)}
.report-item.flash{animation:flashBox 1.4s ease}
@keyframes flashBox{0%{box-shadow:0 0 0 3px var(--brand);background:#eff6ff}100%{box-shadow:var(--shadow);background:var(--card)}}
@media(max-width:960px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .card.wide{grid-column:1/-1}
}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .card.wide{grid-column:1/-1}
  .header h1{font-size:21px}
  .exam-topbar{flex-wrap:wrap;justify-content:center}
  .exam-title-wrap{flex:1 1 auto}
  .exam-timer{min-width:76px}
  .question-text{font-size:16px}
  .actions{flex-wrap:wrap}
  .question-card{height:66vh}
}
</style>
</head>
<body>
<div class="container">

  <!-- Home -->
  <section id="homeView">
    <div class="header">
      <div>
        <h1>智警杯大数据技能赛道 · 理论题库</h1>
        <div class="subtitle" id="homeSubtitle">共 0 题，支持顺序练习、随机练习与背题</div>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <h2>判断题</h2>
        <div class="count" id="judgmentCount">0 题</div>
        <div class="btn-row">
          <button class="btn primary" onclick="startPractice('judgment','order')">顺序练习</button>
          <button class="btn" onclick="startPractice('judgment','random')">随机练习</button>
          <button class="btn" onclick="startPractice('judgment','back')">背题</button>
        </div>
        <div class="continue-box" id="judgmentContinue"></div>
      </div>

      <div class="card">
        <h2>单选题</h2>
        <div class="count" id="singleCount">0 题</div>
        <div class="btn-row">
          <button class="btn primary" onclick="startPractice('single','order')">顺序练习</button>
          <button class="btn" onclick="startPractice('single','random')">随机练习</button>
          <button class="btn" onclick="startPractice('single','back')">背题</button>
        </div>
        <div class="continue-box" id="singleContinue"></div>
      </div>

      <div class="card">
        <h2>多选题</h2>
        <div class="count" id="multipleCount">0 题</div>
        <div class="btn-row">
          <button class="btn primary" onclick="startPractice('multiple','order')">顺序练习</button>
          <button class="btn" onclick="startPractice('multiple','random')">随机练习</button>
          <button class="btn" onclick="startPractice('multiple','back')">背题</button>
        </div>
        <div class="continue-box" id="multipleContinue"></div>
      </div>

      <div class="card wide">
        <h2>模拟考试</h2>
        <div class="count">判断题 20 题 · 单选题 40 题 · 多选题 20 题，满分 100 分，限时 60 分钟</div>
        <div class="btn-row">
          <button class="btn primary" onclick="startExam()">随机组卷并开始考试</button>
        </div>
      </div>

      <div class="card wide">
        <h2>错题集</h2>
        <div class="count" id="wrongCount">0 题</div>
        <div class="btn-row">
          <button class="btn primary" onclick="showWrongView()">查看错题</button>
          <button class="btn" onclick="startWrongPractice('order')">顺序练习</button>
          <button class="btn" onclick="startWrongPractice('random')">随机练习</button>
        </div>
        <div class="continue-box" id="wrongContinue"></div>
      </div>
    </div>
  </section>

  <!-- Practice -->
  <section id="practiceView" class="hidden">
    <div class="topbar">
      <button class="btn ghost" onclick="backHome()">‹ 返回</button>
      <h1 id="practiceTitle">练习</h1>
      <button class="btn danger small" onclick="abandonCurrent()">放弃进度</button>
    </div>
    <div class="jump-bar">
      <label for="pageInput">跳转到第</label>
      <input class="page-input" id="pageInput" type="number" min="1" value="1" inputmode="numeric" onkeydown="if(event.key==='Enter')jumpToQuestion()">
      <span class="page-total">/ <span id="pageTotal">1</span> 题</span>
      <button class="btn small" onclick="jumpToQuestion()">跳转</button>
    </div>
    <div class="progress"><span id="progressBar"></span></div>
    <div class="question-card" id="questionCard"></div>
    <div class="actions">
      <button class="btn" id="prevBtn" onclick="prevQuestion()">上一题</button>
      <div class="spacer"></div>
      <button class="btn primary" id="nextBtn" onclick="nextQuestion()">下一题</button>
    </div>
  </section>

  <!-- Exam -->
  <section id="examView" class="hidden">
    <div class="topbar exam-topbar">
      <div class="exam-title-wrap">
        <button class="btn ghost" onclick="exitExam()">‹ 退出</button>
        <h1>模拟考试</h1>
      </div>
      <div class="exam-timer" id="examTimer">60:00</div>
      <button class="btn primary" onclick="submitExam()">交卷</button>
    </div>
    <div class="exam-info">
      <span id="examProgressText">第 1 / 80 题</span>
      <span>判断题 1 分 · 单选题 1 分 · 多选题 2 分</span>
    </div>
    <div class="progress"><span id="examProgressBar"></span></div>
    <div class="question-card" id="examQuestionCard"></div>
    <div class="actions">
      <button class="btn" id="examPrevBtn" onclick="examPrev()">上一题</button>
      <div class="spacer"></div>
      <button class="btn primary" id="examNextBtn" onclick="examNext()">下一题</button>
    </div>
  </section>

  <!-- Wrong list -->
  <section id="wrongView" class="hidden">
    <div class="topbar">
      <button class="btn ghost" onclick="backHome()">‹ 返回</button>
      <h1>错题集</h1>
      <button class="btn danger small" onclick="clearWrong()">清空错题</button>
    </div>
    <div id="wrongList" class="wrong-list"></div>
  </section>
</div>

<div class="modal" id="completeModal">
  <div class="modal-box">
    <h2>完成啦</h2>
    <p id="completeText">这一组已经练完。</p>
    <button class="btn primary" onclick="closeComplete()">返回首页</button>
  </div>
</div>

<section id="reportView" class="hidden">
  <div class="topbar">
    <h1>模考报告</h1>
    <button class="btn danger small" onclick="closeExamReport()">返回首页</button>
  </div>
  <div class="report-card">
    <div style="text-align:center">
      <div class="exam-score" id="reportScore">0 分</div>
      <div class="report-sub" id="reportSub"></div>
    </div>
    <div class="report-stats" id="reportStats"></div>
  </div>
  <div class="report-tabs">
    <button class="btn" id="tabWrong" onclick="reportTab('wrong')">错题（<span id="tabWrongCount">0</span>）</button>
    <button class="btn" id="tabRight" onclick="reportTab('right')">对题（<span id="tabRightCount">0</span>）</button>
  </div>
  <div id="reportList" class="report-list"></div>
  <button type="button" class="answer-card-fab" onclick="toggleAnswerCard()">答题卡</button>
  <div class="answer-card-panel" id="answerCardPanel">
    <div class="answer-card-head">
      <b>答题卡总览</b>
      <div class="answer-card-legend">
        <span><span class="dot ok"></span>对</span>
        <span><span class="dot bad"></span>错</span>
        <span><span class="dot na"></span>未做</span>
      </div>
      <button class="btn small" onclick="toggleAnswerCard()">收起</button>
    </div>
    <div class="answer-card-grid" id="answerCardGrid"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
const DATA = window.QUESTION_DATA || [];
const TYPE_LABELS = { judgment:'判断题', single:'单选题', multiple:'多选题' };
const TYPE_ORDER = ['judgment','single','multiple'];
const WRONG_KEY = 'law_quiz_wrong_ids';
const PROGRESS_PREFIX = 'law_quiz_progress_';
const WRONG_PROGRESS_KEY = 'law_quiz_wrong_progress';
const EXAM_TIME_LIMIT = 60 * 60;

let current = null;
let selected = null;
let answered = false;
let toastTimer = null;
let exam = null;
let examTimerId = null;
let examRemaining = EXAM_TIME_LIMIT;
let examSubmitted = false;
let examReport = null;
let reportTabType = 'wrong';

function qs(id){ return document.getElementById(id); }
function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}
function removeKey(key){
  try{ localStorage.removeItem(key); }catch(e){}
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function byType(type){ return DATA.filter(q => q.type === type); }
function normalizeWrongRecords(raw){
  const list = Array.isArray(raw) ? raw : [];
  const map = new Map();
  list.forEach(item => {
    let id = null;
    let count = 1;
    if(typeof item === 'number' || typeof item === 'string'){
      id = Number(item);
    }else if(item && item.id != null){
      id = Number(item.id);
      count = Math.max(1, Number(item.count) || Number(item.wrongCount) || 1);
    }
    if(Number.isFinite(id)){
      const old = map.get(id);
      if(old) old.count = Math.max(old.count, count);
      else map.set(id, { id, count });
    }
  });
  return Array.from(map.values());
}
function wrongRecords(){
  return normalizeWrongRecords(loadJSON(WRONG_KEY, []))
    .sort((a,b) => (b.count - a.count) || (a.id - b.id));
}
function saveWrongRecords(records){
  saveJSON(WRONG_KEY, records.sort((a,b) => (b.count - a.count) || (a.id - b.id)));
}
function wrongIds(){ return wrongRecords().map(r => r.id); }
function wrongQuestions(){
  const counts = new Map(wrongRecords().map(r => [r.id, r.count]));
  return DATA.filter(q => counts.has(q.id))
    .sort((a,b) => (counts.get(b.id) - counts.get(a.id)) || (a.id - b.id));
}
function addWrong(id){
  const records = wrongRecords();
  const record = records.find(r => r.id === id);
  let isNew = false;
  if(record){
    record.count += 1;
  }else{
    records.push({ id, count:1 });
    isNew = true;
  }
  saveWrongRecords(records);
  return { isNew, count: record ? record.count : 1 };
}
function removeWrong(id){
  saveWrongRecords(wrongRecords().filter(r => r.id !== id));
}
function clearWrong(){
  if(!wrongRecords().length){ showToast('错题集已经是空的了'); return; }
  if(confirm('确定清空全部错题吗？')){
    saveJSON(WRONG_KEY, []);
    showToast('错题集已清空');
    renderHome();
    showWrongView();
  }
}
function progressKey(type){ return PROGRESS_PREFIX + type; }
function saveProgress(){
  if(!current) return;
  const data = { mode: current.mode, order: current.order, index: current.index };
  if(current.isWrongSet){
    saveJSON(WRONG_PROGRESS_KEY, data);
  }else{
    saveJSON(progressKey(current.type), data);
  }
  renderHome();
}
function clearCurrentProgress(){
  if(!current) return;
  if(current.isWrongSet) removeKey(WRONG_PROGRESS_KEY);
  else removeKey(progressKey(current.type));
  current = null;
  renderHome();
}
function continueText(p){
  const typeLabel = p.isWrong ? '错题集' : TYPE_LABELS[p.type];
  const modeLabel = p.mode === 'order' ? '顺序练习' : (p.mode === 'random' ? '随机练习' : '背题');
  return `${typeLabel} · ${modeLabel} · 第 ${p.index + 1} 题`;
}
function startPractice(type, mode){
  const pool = byType(type);
  if(!pool.length){ showToast('这个模块暂时没有题目'); return; }
  const order = mode === 'random' ? shuffle(pool.map(q => q.id)) : pool.map(q => q.id);
  current = { type, mode, order, index:0, isWrongSet:false };
  saveProgress();
  enterPractice();
}
function startWrongPractice(mode){
  const pool = wrongQuestions();
  if(!pool.length){ showToast('错题集还是空的，先去练习吧'); return; }
  const order = mode === 'random' ? shuffle(pool.map(q => q.id)) : pool.map(q => q.id);
  current = { type:'wrong', mode, order, index:0, isWrongSet:true };
  saveProgress();
  enterPractice();
}
function startExam(){
  const judgments = byType('judgment');
  const singles = byType('single');
  const multiples = byType('multiple');
  if(judgments.length < 20 || singles.length < 40 || multiples.length < 20){
    showToast('当前题库数量不足，暂时无法按标准组卷');
    return;
  }
  const order = [
    ...shuffle(judgments.map(q => q.id)).slice(0, 20),
    ...shuffle(singles.map(q => q.id)).slice(0, 40),
    ...shuffle(multiples.map(q => q.id)).slice(0, 20)
  ];
  current = null;
  selected = null;
  answered = false;
  exam = { order, index:0, answers:{} };
  examRemaining = EXAM_TIME_LIMIT;
  examSubmitted = false;
  qs('homeView').classList.add('hidden');
  qs('practiceView').classList.add('hidden');
  qs('wrongView').classList.add('hidden');
  qs('reportView').classList.add('hidden');
  qs('examView').classList.remove('hidden');
  renderExamQuestion();
  startExamTimer();
  window.scrollTo({top:0, behavior:'smooth'});
}
function exitExam(){
  if(exam && !examSubmitted && !confirm('确定退出考试吗？本次答题不会保存。')) return;
  clearExamTimer();
  exam = null;
  backHome();
}
function startExamTimer(){
  clearExamTimer();
  updateExamTimer();
  examTimerId = setInterval(() => {
    examRemaining -= 1;
    updateExamTimer();
    if(examRemaining <= 0){
      clearExamTimer();
      submitExam(true);
    }
  }, 1000);
}
function clearExamTimer(){
  if(examTimerId){
    clearInterval(examTimerId);
    examTimerId = null;
  }
}
function updateExamTimer(){
  const value = Math.max(0, examRemaining);
  const minutes = Math.floor(value / 60);
  const seconds = value % 60;
  const el = qs('examTimer');
  el.textContent = `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
  el.classList.toggle('warning', value <= 300);
}
function examCurrentQuestion(){
  if(!exam) return null;
  const id = exam.order[exam.index];
  return DATA.find(q => q.id === id) || null;
}
function renderExamQuestion(){
  const q = examCurrentQuestion();
  if(!q){
    qs('examQuestionCard').innerHTML = '<div class="question-text">题目不存在或已被移除。</div>';
    return;
  }
  const total = exam.order.length;
  const idx = exam.index + 1;
  qs('examProgressText').textContent = `第 ${idx} / ${total} 题`;
  qs('examProgressBar').style.width = `${(idx/total)*100}%`;

  const typeLabel = TYPE_LABELS[q.type];
  const scoreLabel = q.type === 'multiple' ? '2 分' : '1 分';
  const meta = `<div class="meta">
    <span class="badge ${q.type}">${typeLabel}</span>
    <span>${idx} / ${total}</span>
    <span>${scoreLabel}</span>
    <span>${escapeHtml(q.source)}</span>
  </div>`;
  const questionHtml = `<div class="question-text">${escapeHtml(q.question)}</div>`;
  const optionsHtml = renderExamOptions(q);
  qs('examQuestionCard').innerHTML = meta + questionHtml + optionsHtml;

  qs('examPrevBtn').disabled = exam.index <= 0;
  qs('examNextBtn').textContent = exam.index >= total - 1 ? '去交卷' : '下一题';
}
function renderExamOptions(q){
  let options = [];
  if(q.type === 'judgment'){
    options = [{ key:'T', text:'正确' }, { key:'F', text:'错误' }];
  }else{
    options = q.options && q.options.length ? q.options : [];
  }
  return `<div class="options">${options.map(o => renderExamOptionButton(q,o)).join('')}</div>`;
}
function renderExamOptionButton(q,o){
  const answer = exam.answers[q.id];
  const selected = q.type === 'multiple'
    ? (Array.isArray(answer) && answer.includes(o.key))
    : answer === o.key;
  const cls = selected ? 'option selected' : 'option';
  return `<button type="button" class="${cls}" onclick="handleExamOption('${o.key}', ${q.type === 'multiple'})">
    <span class="key">${escapeHtml(o.key)}</span>
    <span>${escapeHtml(o.text || '')}</span>
  </button>`;
}
function handleExamOption(key, multi){
  if(!exam || examSubmitted) return;
  const q = examCurrentQuestion();
  if(!q) return;
  if(multi){
    let answer = exam.answers[q.id];
    if(!Array.isArray(answer)) answer = [];
    if(answer.includes(key)) answer = answer.filter(x => x !== key);
    else answer.push(key);
    exam.answers[q.id] = answer;
  }else{
    exam.answers[q.id] = key;
  }
  renderExamQuestion();
}
function examPrev(){
  if(!exam || exam.index <= 0) return;
  exam.index--;
  renderExamQuestion();
}
function examNext(){
  if(!exam) return;
  if(exam.index >= exam.order.length - 1){
    submitExam();
    return;
  }
  exam.index++;
  renderExamQuestion();
}
function isExamAnswerCorrect(q, answer){
  if(!q || !q.answer || !q.answer.length) return false;
  if(q.type === 'multiple'){
    return Array.isArray(answer) && JSON.stringify(answer.slice().sort()) === JSON.stringify(q.answer.slice().sort());
  }
  return answer === q.answer[0];
}
function submitExam(auto = false){
  if(!exam || examSubmitted) return;
  clearExamTimer();
  examSubmitted = true;

  let correct = 0;
  let wrong = 0;
  let unanswered = 0;
  let score = 0;
  const items = [];

  exam.order.forEach(id => {
    const q = DATA.find(item => item.id === id);
    if(!q) return;
    const answer = exam.answers[q.id];
    const answered = q.type === 'multiple'
      ? (Array.isArray(answer) && answer.length > 0)
      : !!answer;
    const isCorrect = isExamAnswerCorrect(q, answer);
    if(isCorrect){
      correct += 1;
      score += q.type === 'multiple' ? 2 : 1;
    }else{
      wrong += 1;
      if(!answered) unanswered += 1;
      addWrong(q.id);
    }
    items.push({ q, answer, isCorrect, answered });
  });

  examReport = { items, correct, wrong, unanswered, score, auto, timeUsed: EXAM_TIME_LIMIT - examRemaining };
  showExamReport();
}
function showExamReport(){
  qs('homeView').classList.add('hidden');
  qs('practiceView').classList.add('hidden');
  qs('wrongView').classList.add('hidden');
  qs('examView').classList.add('hidden');
  qs('reportView').classList.remove('hidden');
  renderExamReport();
  window.scrollTo({top:0, behavior:'smooth'});
}
function closeExamReport(){
  examReport = null;
  exam = null;
  backHome();
}
function renderExamReport(){
  if(!examReport) return;
  const r = examReport;
  const total = r.items.length;
  const fullScore = r.items.reduce((s, it) => s + (it.q.type === 'multiple' ? 2 : 1), 0);
  const rate = total ? Math.round((r.correct / total) * 100) : 0;
  const minutes = Math.floor(r.timeUsed / 60);
  const seconds = r.timeUsed % 60;

  qs('reportScore').textContent = `${r.score} 分`;
  qs('reportSub').textContent = `共 ${total} 题 · 满分 ${fullScore} 分 · 用时 ${minutes} 分 ${seconds} 秒` +
    (r.auto ? ' · 时间到自动交卷' : '');

  qs('reportStats').innerHTML =
    `<div class="report-stat"><div class="num ok">${r.score}</div><div class="lbl">得分</div></div>` +
    `<div class="report-stat"><div class="num">${rate}%</div><div class="lbl">正确率</div></div>` +
    `<div class="report-stat"><div class="num ok">${r.correct}</div><div class="lbl">答对</div></div>` +
    `<div class="report-stat"><div class="num bad">${r.wrong}</div><div class="lbl">答错</div></div>` +
    `<div class="report-stat"><div class="num">${r.unanswered}</div><div class="lbl">未作答</div></div>`;

  qs('tabWrongCount').textContent = r.wrong;
  qs('tabRightCount').textContent = r.correct;
  qs('answerCardPanel').classList.remove('show');
  renderAnswerCard();
  reportTab(reportTabType);
}
function renderAnswerCard(){
  const r = examReport;
  if(!r) return;
  qs('answerCardGrid').innerHTML = r.items.map((it, gi) => {
    const cls = it.isCorrect ? 'ok' : (it.answered ? 'bad' : '');
    return `<div class="ac-cell ${cls}" onclick="jumpToReportQuestion(${gi})" title="第 ${gi + 1} 题">${gi + 1}</div>`;
  }).join('');
}
function toggleAnswerCard(){
  qs('answerCardPanel').classList.toggle('show');
}
function jumpToReportQuestion(gi){
  const r = examReport;
  if(!r || !r.items[gi]) return;
  reportTab(r.items[gi].isCorrect ? 'right' : 'wrong');
  const el = qs('reportItem-' + gi);
  if(el){
    el.scrollIntoView({ behavior:'smooth', block:'start' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1500);
  }
}
function reportTab(type){
  if(!examReport) return;
  reportTabType = type;
  qs('tabWrong').classList.toggle('active', type === 'wrong');
  qs('tabRight').classList.toggle('active', type === 'right');
  const list = examReport.items
    .map((it, gi) => ({ it, gi }))
    .filter(x => (type === 'wrong') ? !x.it.isCorrect : x.it.isCorrect);
  const wrap = qs('reportList');
  if(!list.length){
    wrap.innerHTML = `<div class="report-empty">${type === 'wrong' ? '太棒了，本次没有错题 🎉' : '本次没有答对的题目，继续加油'}</div>`;
    return;
  }
  wrap.innerHTML = list.map(x => renderReportItem(x.it, x.gi)).join('');
}
function answerText(q, answer){
  if(q.type === 'judgment') return answer === 'T' ? '正确' : (answer === 'F' ? '错误' : '');
  return Array.isArray(answer) ? answer.slice().sort().join('、') : (answer || '');
}
function renderReportItem(it, gi){
  const q = it.q;
  const typeLabel = TYPE_LABELS[q.type];
  const options = q.type === 'judgment'
    ? [{ key:'T', text:'正确' }, { key:'F', text:'错误' }]
    : (q.options || []);
  const chosen = q.type === 'multiple' ? (Array.isArray(it.answer) ? it.answer : []) : (it.answer ? [it.answer] : []);
  const optionsHtml = options.map(o => {
    const isAns = q.answer.includes(o.key);
    const isChosen = chosen.includes(o.key);
    let cls = 'report-opt';
    let tag = '';
    if(isAns){ cls += ' is-answer'; tag = '<span class="tag tag-ok">正确答案</span>'; }
    else if(isChosen){ cls += ' chosen-wrong'; tag = '<span class="tag tag-bad">你的答案</span>'; }
    if(isChosen && isAns){ tag = '<span class="tag tag-ok">你的答案 ✓</span>'; }
    return `<div class="${cls}"><span class="key">${escapeHtml(o.key)}</span><span>${escapeHtml(o.text || '')}</span>${tag}</div>`;
  }).join('');
  const ansLabel = answerLabel(q);
  const yoursLabel = it.answered ? answerText(q, it.answer) : '未作答';
  const yoursCls = it.isCorrect ? 'yours-ok' : 'yours-bad';
  const expl = q.explanation
    ? `<div class="report-expl"><span class="expl-label">解析</span>${escapeHtml(q.explanation)}</div>`
    : '';
  return `<div class="report-item" id="reportItem-${gi}">
    <div class="meta">
      <span class="badge ${q.type}">${typeLabel}</span>
      <span class="${it.isCorrect ? 'tag-ok' : 'tag-bad'}" style="font-weight:700">${it.isCorrect ? '✓ 答对' : '✗ 答错'}</span>
      <span>${escapeHtml(q.source)}</span>
    </div>
    <div class="q-text">${escapeHtml(q.question)}</div>
    <div class="report-options">${optionsHtml}</div>
    <div class="report-answer-line">你的答案：<span class="${yoursCls}">${escapeHtml(yoursLabel)}</span> · 正确答案：<b>${escapeHtml(ansLabel)}</b></div>
    ${expl}
  </div>`;
}
function continueLast(type){
  const p = loadJSON(progressKey(type), null);
  if(!p || !Array.isArray(p.order) || !p.order.length){ return; }
  current = { type, mode:p.mode, order:p.order, index:Math.min(p.index, p.order.length-1), isWrongSet:false };
  enterPractice();
}
function continueWrong(){
  const p = loadJSON(WRONG_PROGRESS_KEY, null);
  if(!p || !Array.isArray(p.order) || !p.order.length){ return; }
  const counts = new Map(wrongRecords().map(r => [r.id, r.count]));
  const order = p.order.filter(id => counts.has(id));
  if(!order.length){ removeKey(WRONG_PROGRESS_KEY); return; }
  if(p.mode === 'order'){
    order.sort((a,b) => (counts.get(b) - counts.get(a)) || (p.order.indexOf(a) - p.order.indexOf(b)));
  }
  const savedId = p.order[Math.min(p.index, p.order.length - 1)];
  const savedIndex = order.indexOf(savedId);
  current = { type:'wrong', mode:p.mode, order, index:savedIndex >= 0 ? savedIndex : 0, isWrongSet:true };
  enterPractice();
}
function abandonLast(type){ removeKey(progressKey(type)); renderHome(); }
function abandonWrongLast(){ removeKey(WRONG_PROGRESS_KEY); renderHome(); }
function abandonCurrent(){
  if(!current){ return; }
  clearCurrentProgress();
  showToast('已放弃本次进度');
  backHome();
}
function enterPractice(){
  qs('homeView').classList.add('hidden');
  qs('wrongView').classList.add('hidden');
  qs('examView').classList.add('hidden');
  qs('reportView').classList.add('hidden');
  qs('practiceView').classList.remove('hidden');
  selected = null;
  answered = false;
  renderQuestion();
  window.scrollTo({top:0, behavior:'smooth'});
}
function backHome(){
  if(current){ saveProgress(); }
  current = null;
  qs('practiceView').classList.add('hidden');
  qs('wrongView').classList.add('hidden');
  qs('examView').classList.add('hidden');
  qs('reportView').classList.add('hidden');
  qs('homeView').classList.remove('hidden');
  renderHome();
  window.scrollTo({top:0, behavior:'smooth'});
}
function showWrongView(){
  current = null;
  qs('homeView').classList.add('hidden');
  qs('practiceView').classList.add('hidden');
  qs('examView').classList.add('hidden');
  qs('reportView').classList.add('hidden');
  qs('wrongView').classList.remove('hidden');
  renderWrongList();
  window.scrollTo({top:0, behavior:'smooth'});
}
function currentQuestion(){
  if(!current) return null;
  const id = current.order[current.index];
  return DATA.find(q => q.id === id) || null;
}
function questionType(q){
  if(current && current.isWrongSet) return q.type;
  return current ? current.type : q.type;
}
function renderQuestion(){
  const q = currentQuestion();
  if(!q){ qs('questionCard').innerHTML = '<div class="question-text">题目不存在或已被移除。</div>'; return; }
  const isWrong = current.isWrongSet;
  const type = q.type;
  const total = current.order.length;
  const idx = current.index + 1;
  const modeLabel = current.mode === 'order' ? '顺序练习' : (current.mode === 'random' ? '随机练习' : '背题');
  const typeLabel = isWrong ? `错题集 · ${TYPE_LABELS[type]}` : TYPE_LABELS[type];
  qs('practiceTitle').textContent = `${typeLabel} · ${modeLabel}`;
  qs('progressBar').style.width = `${(idx/total)*100}%`;
  const pageInput = qs('pageInput');
  pageInput.max = total;
  pageInput.value = idx;
  qs('pageTotal').textContent = total;

  const meta = `<div class="meta">
    <span class="badge ${type}">${TYPE_LABELS[type]}</span>
    <span>${idx} / ${total}</span>
    <span>${escapeHtml(q.source)}</span>
  </div>`;
  const questionHtml = `<div class="question-text">${escapeHtml(q.question)}</div>`;

  let optionsHtml = '';
  if(type === 'judgment'){
    optionsHtml = renderJudgmentOptions(q);
  }else{
    optionsHtml = renderChoiceOptions(q);
  }

  let revealHtml = '';
  if(answered || current.mode === 'back'){
    revealHtml = renderReveal(q);
  }
  qs('questionCard').innerHTML = meta + questionHtml + optionsHtml + revealHtml;
  qs('prevBtn').disabled = current.index <= 0;
  qs('nextBtn').disabled = current.mode !== 'back' && !answered;
  qs('nextBtn').textContent = current.index >= total - 1 ? '完成' : '下一题';
  saveProgress();
}
function renderJudgmentOptions(q){
  const options = [
    { key:'T', text:'正确' },
    { key:'F', text:'错误' }
  ];
  return `<div class="options">${options.map(o => renderOptionButton(q,o)).join('')}</div>`;
}
function renderChoiceOptions(q){
  const options = q.options && q.options.length ? q.options : [];
  return `<div class="options">${options.map(o => renderOptionButton(q,o)).join('')}</div>`;
}
function renderOptionButton(q,o){
  const isBack = current.mode === 'back';
  const key = o.key;
  let cls = 'option';
  if(isBack || answered){
    if(isCorrect(q,key)) cls += ' correct';
    else if(selected && (Array.isArray(selected) ? selected.includes(key) : selected === key)) cls += ' wrong';
  }else if(selected && (Array.isArray(selected) ? selected.includes(key) : selected === key)){
    cls += ' selected';
  }
  const click = (isBack || answered) ? '' : `onclick="handleOption('${key}', ${q.type === 'multiple'})"`;
  return `<button type="button" class="${cls}" ${click}>
    <span class="key">${escapeHtml(key)}</span>
    <span>${escapeHtml(o.text || '')}</span>
  </button>`;
}
function renderReveal(q){
  const correct = isUserCorrect(q);
  const cls = current.mode === 'back' ? '' : (correct ? 'correct' : 'wrong');
  const ansLabel = answerLabel(q);
  const expl = q.explanation ? `<div style="margin-top:8px;color:var(--muted)">${escapeHtml(q.explanation)}</div>` : '';
  return `<div class="reveal ${cls}">
    <div>正确答案：<span class="ans">${escapeHtml(ansLabel)}</span></div>
    ${expl}
  </div>`;
}
function answerLabel(q){
  if(q.type === 'judgment') return q.answer[0] === 'T' ? '正确' : '错误';
  return q.answer.join('、');
}
function isCorrect(q,key){
  if(q.type === 'judgment') return q.answer[0] === key;
  if(Array.isArray(key)) return JSON.stringify([...key].sort()) === JSON.stringify(q.answer.slice().sort());
  return q.answer.length === 1 && q.answer[0] === key;
}
function isUserCorrect(q){
  if(!answered && current.mode !== 'back') return false;
  if(current.mode === 'back') return true;
  if(q.type === 'multiple') return isCorrect(q, selected || []);
  return isCorrect(q, selected);
}
function handleOption(key, multi){
  if(answered || current.mode === 'back') return;
  if(multi){
    if(!Array.isArray(selected)) selected = [];
    if(selected.includes(key)) selected = selected.filter(x => x !== key);
    else selected.push(key);
    renderQuestion();
    return;
  }
  selected = key;
  submitAnswer();
}
function submitAnswer(){
  const q = currentQuestion();
  if(!q || answered) return;
  answered = true;
  if(q.type !== 'multiple'){
    if(!isUserCorrect(q)){
      const result = addWrong(q.id);
      showToast(result.isNew ? '已加入错题集' : `错误次数 +1，累计 ${result.count} 次`);
    }
  }
  renderQuestion();
}
function confirmMultiple(){
  const q = currentQuestion();
  if(!q || answered) return;
  if(!Array.isArray(selected) || selected.length === 0){ showToast('请先选择至少一个选项'); return; }
  answered = true;
  if(!isUserCorrect(q)){
    const result = addWrong(q.id);
    showToast(result.isNew ? '已加入错题集' : `错误次数 +1，累计 ${result.count} 次`);
  }
  renderQuestion();
}
function nextQuestion(){
  if(!current) return;
  if(current.index >= current.order.length - 1){
    qs('completeText').textContent = `已完成 ${current.order.length} 道题。`;
    qs('completeModal').classList.add('show');
    return;
  }
  current.index++;
  selected = null;
  answered = false;
  renderQuestion();
}
function jumpToQuestion(){
  if(!current) return;
  const total = current.order.length;
  const input = qs('pageInput');
  const target = Math.floor(Number(input.value));
  if(!Number.isFinite(target) || target < 1 || target > total){
    showToast(`请输入 1 到 ${total} 之间的页码`);
    input.value = current.index + 1;
    return;
  }
  current.index = target - 1;
  selected = null;
  answered = false;
  renderQuestion();
  showToast(`已跳转到第 ${target} 题`);
}
function prevQuestion(){
  if(!current || current.index <= 0) return;
  current.index--;
  selected = null;
  answered = false;
  renderQuestion();
}
function closeComplete(){
  qs('completeModal').classList.remove('show');
  backHome();
}
function renderHome(){
  const counts = {};
  TYPE_ORDER.forEach(type => {
    counts[type] = byType(type).length;
    qs(type + 'Count').textContent = `${counts[type]} 题`;
  });
  qs('wrongCount').textContent = `${wrongIds().length} 题`;
  qs('homeSubtitle').textContent = `共 ${DATA.length} 题 · 判断题 ${counts.judgment} · 单选题 ${counts.single} · 多选题 ${counts.multiple}`;
  renderContinueButtons();
}
function renderContinueButtons(){
  TYPE_ORDER.forEach(type => {
    renderTypeContinue(type);
  });
  const wp = loadJSON(WRONG_PROGRESS_KEY, null);
  const box = qs('wrongContinue');
  if(wp && Array.isArray(wp.order) && wp.order.length){
    box.classList.add('show');
    box.innerHTML = `<div class="row"><span class="label">${escapeHtml(continueText({type:'wrong',mode:wp.mode,index:wp.index,isWrong:true}))}</span></div>
      <div class="btn-row"><button class="btn small primary" onclick="continueWrong()">继续</button>
      <button class="btn small danger" onclick="abandonWrongLast()">放弃</button></div>`;
  }else{
    box.classList.remove('show');
    box.innerHTML = '';
  }
}
function renderTypeContinue(type){
  const p = loadJSON(progressKey(type), null);
  const box = qs(type + 'Continue');
  if(p && Array.isArray(p.order) && p.order.length){
    box.classList.add('show');
    box.innerHTML = `<div class="row"><span class="label">${escapeHtml(continueText({type,mode:p.mode,index:p.index,isWrong:false}))}</span></div>
      <div class="btn-row"><button class="btn small primary" onclick="continueLast('${type}')">继续</button>
      <button class="btn small danger" onclick="abandonLast('${type}')">放弃</button></div>`;
  }else{
    box.classList.remove('show');
    box.innerHTML = '';
  }
}
function renderWrongList(){
  const list = wrongQuestions();
  const counts = new Map(wrongRecords().map(r => [r.id, r.count]));
  const wrap = qs('wrongList');
  if(!list.length){
    wrap.innerHTML = '<div class="card" style="text-align:center;color:var(--muted)">错题集是空的，先去练习吧。</div>';
    return;
  }
  wrap.innerHTML = list.map(q => {
    const optionsHtml = q.options && q.options.length ? q.options.map(o => `<div><b>${escapeHtml(o.key)}.</b> ${escapeHtml(o.text)}</div>`).join('') : '';
    return `<div class="wrong-item">
      <div class="meta">
        <span class="badge ${q.type}">${TYPE_LABELS[q.type]}</span>
        <span class="wrong-count">错误 ${counts.get(q.id) || 1} 次</span>
        <span>${escapeHtml(q.source)}</span>
      </div>
      <div class="question-text" style="font-size:15px">${escapeHtml(q.question)}</div>
      ${optionsHtml ? `<div style="font-size:14px;color:var(--muted);margin:8px 0">${optionsHtml}</div>` : ''}
      <div class="reveal">
        <div>正确答案：<span class="ans">${escapeHtml(answerLabel(q))}</span></div>
        <div class="wrong-explanation"><span class="expl-label">解析</span>${escapeHtml(q.explanation || '暂无解析')}</div>
      </div>
      <div style="text-align:right;margin-top:10px"><button class="btn small danger" onclick="removeWrongAndRerender(${q.id})">移出错题集</button></div>
    </div>`;
  }).join('');
}
function removeWrongAndRerender(id){
  removeWrong(id);
  renderWrongList();
  renderHome();
  showToast('已移出错题集');
}
function showToast(msg){
  const el = qs('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// multi-select submit button is injected after options when type is multiple and interactive
const origRenderQuestion = renderQuestion;
renderQuestion = function(){
  const q = currentQuestion();
  if(q && q.type === 'multiple' && current.mode !== 'back' && !answered){
    const wrap = qs('questionCard');
    const old = qs('confirmMultipleBtn');
    if(old) old.remove();
    origRenderQuestion();
    const btn = document.createElement('button');
    btn.id = 'confirmMultipleBtn';
    btn.type = 'button';
    btn.className = 'btn primary';
    btn.style.marginTop = '12px';
    btn.textContent = '确认答案';
    btn.onclick = confirmMultiple;
    qs('questionCard').appendChild(btn);
  }else{
    origRenderQuestion();
  }
};

renderHome();
</script>
</body>
</html>
